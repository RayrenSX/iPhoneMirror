# Local SRS configuration for iPhoneMirror media-output verification.
# It bridges RTMP, SRT and WebRTC through the live/livestream application.
max_connections 1000;
daemon off;
srs_log_tank console;
srs_log_level warn;

rtmp {
    listen 1935;
}

http_api {
    enabled on;
    listen 1985;
}

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

rtc_server {
    enabled on;
    listen 8000;
    candidate $CANDIDATE;
}

srt_server {
    enabled on;
    listen 10080;
    connect_timeout 4000;
    peerlatency 120;
    recvlatency 120;
    latency 120;
    tlpktdrop on;
    tsbpdmode on;
    default_streamid "#!::r=live/livestream,m=publish";
}

vhost __defaultVhost__ {
    hls {
        enabled on;
        hls_fragment 2;
        hls_window 6;
    }

    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }

    rtc {
        enabled on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }

    srt {
        enabled on;
        srt_to_rtmp on;
    }
}
