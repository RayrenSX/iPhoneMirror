services:
  srs:
    image: ossrs/srs:6
    command: ["./objs/srs", "-c", "conf/iphoneMirror-srs.conf"]
    environment:
      CANDIDATE: ${SRS_CANDIDATE:-127.0.0.1}
    ports:
      - "${SRS_BIND_ADDRESS:-127.0.0.1}:1935:1935"
      - "${SRS_BIND_ADDRESS:-127.0.0.1}:1985:1985"
      - "${SRS_BIND_ADDRESS:-127.0.0.1}:8080:8080"
      - "${SRS_BIND_ADDRESS:-127.0.0.1}:8000:8000/udp"
      - "${SRS_BIND_ADDRESS:-127.0.0.1}:10080:10080/udp"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/iphoneMirror-srs.conf:ro
      - ./web:/usr/local/srs/objs/nginx/html/iphoneMirror-test:ro
