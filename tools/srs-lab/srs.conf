# Local SRS lab for iPhoneMirror media-output verification.
# All endpoints bind to loopback through Docker port publishing. Do not use
# this configuration as an internet-facing streaming service.

max_connections 1000;
srs_log_tank console;
daemon off;

rtmp {
    listen 1935;
}

http_api {
    enabled on;
    listen 1985;
    crossdomain on;
}

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

srt_server {
    enabled on;
    listen 10080;
    maxbw 1000000000;
    connect_timeout 4000;
    peer_idle_timeout 8000;
    default_app live;
    default_mode publish;
    default_streamid "#!::r=live/iphone-mirror,m=publish";
    peerlatency 0;
    recvlatency 0;
    latency 0;
    tsbpdmode off;
    tlpktdrop on;
    sendbuf 2000000;
    recvbuf 2000000;
}

rtc_server {
    enabled on;
    listen 8000;
    candidate 127.0.0.1;
}

vhost __defaultVhost__ {
    min_latency on;

    play {
        gop_cache off;
        queue_length 3;
        mw_latency 0;
    }

    publish {
        mr off;
        mr_latency 0;
    }

    srt {
        enabled on;
        srt_to_rtmp on;
    }

    hls {
        enabled on;
    }

    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }

    rtc {
        enabled on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }
}
